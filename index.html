<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Fixture Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
:root{--celeste:#74ACDF;--celeste-claro:#B8D8F8;--azul:#1A3A6B;--dorado:#C9A847;--blanco:#FFFFFF;--gris:#F0F4F8;--texto:#1A1A2E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gris);color:var(--texto);padding-bottom:70px;min-height:100vh;-webkit-tap-highlight-color:transparent}
main{padding:8px;max-width:100%}
header{background:linear-gradient(135deg,var(--celeste),var(--azul));color:var(--blanco);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.verlies-tech{font-family:'Michroma',sans-serif;font-size:18px;line-height:1;letter-spacing:.5px}
.verlies-tech .v{color:var(--celeste);-webkit-text-stroke:1px #000;text-stroke:1px #000;paint-order:stroke fill}
.verlies-tech .t{color:var(--blanco);-webkit-text-stroke:1px #000;text-stroke:1px #000;paint-order:stroke fill}
header h1{font-size:18px;font-weight:600;text-align:right}
.dorado{color:var(--dorado)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--blanco);display:flex;border-top:2px solid var(--celeste);z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.1)}
nav button{flex:1;padding:8px 2px;border:none;background:transparent;font-size:9px;font-weight:600;color:var(--azul);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .2s;font-family:inherit;min-width:0}
nav button .icon{font-size:16px}
nav button.active{background:var(--celeste);color:var(--blanco)}
nav button:active{opacity:.7}
/* main moved to body+ */
h2{font-size:16px;color:var(--azul);margin:8px 0 12px;border-left:4px solid var(--dorado);padding:4px 0 4px 10px}
.grupo-card{background:var(--blanco);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.grupo-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--celeste);color:var(--blanco);cursor:pointer;user-select:none;font-weight:700;font-size:15px}
.grupo-header .toggle{font-size:14px;transition:transform .3s}
.grupo-header.open .toggle{transform:rotate(180deg)}
.grupo-body{display:none;padding:10px 14px 14px}
.grupo-body.open{display:block}
.tabla-pos{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.tabla-pos th{background:var(--celeste-claro);color:var(--azul);padding:4px 2px;text-align:center;font-weight:600;font-size:9px}
.tabla-pos td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--gris);font-size:10px}
.tabla-pos td:first-child{text-align:left;font-weight:600;padding-left:4px}
.tabla-pos tr:nth-child(1) td:not(:first-child){background:#E8F5E9}
.tabla-pos tr:nth-child(2) td:not(:first-child){background:#E8F5E9}
.tabla-pos tr:nth-child(3) td:not(:first-child){background:#FFF8E1}
.partido-card{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:4px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--gris);font-size:12px}
.partido-card:last-child{border-bottom:none}
.partido-card .team{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.partido-card .team.local{text-align:right}
.partido-card .team.visit{text-align:left}
.partido-card .score-input{width:34px;height:34px;text-align:center;font-size:15px;font-weight:700;border:2px solid var(--celeste);border-radius:8px;background:var(--blanco);color:var(--azul);outline:none;-moz-appearance:textfield}
.partido-card .score-input::-webkit-inner-spin-button,.partido-card .score-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.partido-card .score-input:focus{border-color:var(--dorado);box-shadow:0 0 0 2px rgba(201,168,71,.3)}
.partido-card .score-sep{font-weight:700;color:var(--azul);font-size:13px}
.partido-card .info{grid-column:1/-1;font-size:11px;color:#666;text-align:center}
.partido-card .info .fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Pool */
.pool-equipos{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pool-grupo{background:var(--blanco);border-radius:10px;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pool-grupo-tit{font-weight:700;color:var(--azul);font-size:13px;margin-bottom:4px}
.pool-eq{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer;user-select:none}
.pool-eq input[type=checkbox]{width:20px;height:20px;accent-color:var(--celeste)}
.pool-eq .pos-badge{font-size:9px;color:#888;background:var(--gris);padding:1px 6px;border-radius:4px}
.pool-eq.disabled{pointer-events:none}
.pool-eq.disabled input[type=checkbox]{opacity:.3}
.pool-eq.elim{opacity:.5;font-size:11px;cursor:default;pointer-events:none}
.pool-eq.elim .pos-badge{background:#ddd;color:#999}
.pool-contador{text-align:center;font-size:13px;font-weight:700;color:var(--azul);padding:8px 0}

/* Armado layout: fixed overlay, scroll cruces + fichas fijas abajo */
.armado-wrap{position:fixed;top:56px;bottom:56px;left:0;right:0;padding:8px;display:flex;flex-direction:column;background:var(--gris);z-index:50}
.armado-cruces{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 8px;min-height:0;display:flex;flex-direction:column;gap:6px}
.armado-tit{flex-shrink:0}
.armado-fichas{flex-shrink:0;background:var(--blanco);border-radius:14px 14px 0 0;box-shadow:0 -3px 12px rgba(0,0,0,.12);padding:8px 10px;max-height:30vh;overflow-y:auto;border-top:3px solid var(--dorado);z-index:10}
.armado-fichas h4{font-size:11px;color:var(--azul);margin-bottom:4px}
.armado-fichas .fichas-grid{gap:4px}
.armado-fichas .ficha{padding:5px 8px;font-size:11px}
.cruce-card{background:var(--blanco);border-radius:10px;padding:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cruce-num{font-size:11px;color:var(--dorado);font-weight:700;margin-bottom:4px}
.cruce-slots{display:flex;gap:8px;align-items:center}
.cruce-slots .slot{flex:1;height:42px;border:2px dashed var(--celeste-claro);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#bbb;transition:all .2s;cursor:pointer;position:relative;background:var(--blanco)}
.cruce-slots .slot.filled{border-style:solid;border-color:var(--celeste);color:var(--texto);font-weight:500}
.cruce-slots .slot.drag-over{border-color:var(--dorado);background:#FFFDF5;transform:scale(1.02)}
.cruce-slots .slot .remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#E74C3C;color:var(--blanco);font-size:12px;line-height:20px;text-align:center;cursor:pointer;font-weight:700;display:none}
.cruce-slots .slot.filled .remove{display:block}
.cruce-slots .slot-fixed{flex:1;height:42px;border:2px solid var(--celeste);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--texto);background:#f0f6ff;cursor:default}
.cruce-sep{font-weight:700;color:var(--azul);font-size:14px}

/* Fichas drag */
.fichas-wrap{background:var(--blanco);border-radius:10px;padding:10px;margin-top:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fichas-wrap h4{font-size:12px;color:var(--azul);margin-bottom:6px}
.fichas-grid{display:flex;flex-wrap:wrap;gap:6px}
.ficha{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--celeste);color:var(--blanco);border-radius:20px;font-size:12px;font-weight:500;cursor:grab;touch-action:none;user-select:none;transition:transform .2s,opacity .2s}
.ficha:active{cursor:grabbing;transform:scale(.95)}
.ficha.usada{opacity:.3;pointer-events:none}
.ficha-drag{position:fixed;z-index:9999;pointer-events:none;opacity:.9;transform:scale(1.1);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.slot-highlight{animation:pulse .5s ease}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* Bracket */
.bracket-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.bracket-scroll{display:flex;gap:clamp(8px,3vw,100px);min-width:min-content}
.round-col{display:flex;flex-direction:column;gap:8px;min-width:150px;max-width:180px;justify-content:flex-start}
.round-col.connector-col{min-width:24px;max-width:24px;justify-content:flex-start}
.round-col h3{text-align:center;background:var(--celeste);color:var(--blanco);padding:5px;border-radius:6px 6px 0 0;font-size:10px;margin:0 0 2px}
.bracket-match{background:var(--blanco);border-radius:6px;padding:6px 8px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:grid;grid-template-columns:1fr 24px 8px 24px 1fr;gap:2px;align-items:center;font-size:11px;border-left:3px solid transparent;min-height:70px;flex-shrink:0}
.round-col.connector-col .bracket-match{height:107px}
.bracket-match .team{font-weight:500;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket-match .team.local{text-align:right}
.bracket-match .team.visit{text-align:left}
.bracket-match .score-input{width:22px;height:26px;text-align:center;font-size:12px;font-weight:700;border:1.5px solid var(--celeste);border-radius:4px;background:var(--blanco);color:var(--azul);outline:none;-moz-appearance:textfield;padding:0}
.bracket-match .score-input::-webkit-inner-spin-button,.bracket-match .score-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.bracket-match .score-sep{font-weight:700;color:var(--azul);font-size:12px;text-align:center}
.bracket-match.match-win{border-left-color:var(--dorado);background:#FFFDF5}
.match-num{grid-column:1/-1;font-size:9px;color:var(--dorado);font-weight:700;margin-bottom:1px}
.match-info{grid-column:1/-1;font-size:8px;color:#999;padding-top:2px;border-top:1px solid #eee;margin-top:2px}
.elim-warning{background:var(--celeste-claro);color:var(--azul);padding:16px;border-radius:10px;text-align:center;font-size:13px;margin:10px 0;line-height:1.5}
.elim-warning strong{display:block;font-size:15px;margin-bottom:6px}
.placeholder-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:#aaa;text-align:center;font-size:14px;gap:12px}
.placeholder-tab .icon{font-size:48px}
.final-card{margin:10px 0}
.final-card.tercero{background:var(--blanco);border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);font-size:13px;text-align:center}
.final-card.grande{background:linear-gradient(135deg,var(--celeste),var(--azul));border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.2);text-align:center;color:var(--blanco)}
.final-card.grande h3{font-size:20px;margin-bottom:12px;color:var(--dorado)}
.final-card.grande .vs{font-size:18px;margin:12px 0}
.final-card.grande .score-input{border-color:var(--dorado);background:rgba(255,255,255,.15);color:var(--blanco);font-size:24px;width:50px;height:50px;border-width:2px}
.final-card.grande .score-sep{font-size:24px;color:var(--dorado)}

.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .2s}
.modal-overlay.hidden{opacity:0;pointer-events:none}
.modal-card{background:var(--blanco);border-radius:16px;padding:24px;width:280px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25);position:relative}
.modal-close{position:absolute;top:8px;right:12px;border:none;background:none;font-size:18px;cursor:pointer;color:#999}
.modal-card h4{font-family:'Michroma',sans-serif;font-size:16px;color:var(--azul);margin-bottom:4px}
.redes-grid{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.redes-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--gris);text-decoration:none;color:var(--texto);font-size:14px;font-weight:500;transition:background .15s}
.redes-item:active{background:var(--celeste-claro)}
.redes-icon{font-size:20px}

.btn{display:inline-block;padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-celeste{background:var(--celeste);color:var(--blanco)}
.btn-dorado{background:var(--dorado);color:var(--blanco)}
.btn-azul{background:var(--azul);color:var(--blanco)}
.btn-riesgo{background:#E74C3C;color:var(--blanco)}
.btn:active{transform:scale(.96);opacity:.9}
.btn-block{width:100%}
.btn-small{padding:6px 12px;font-size:11px}
.btn:disabled{opacity:.5;pointer-events:none}
.resumen-box{background:var(--blanco);border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:12px}
.resumen-box .item{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0}
.resumen-box .item:last-child{border-bottom:none}
.resumen-box .item .label{color:#888}
.resumen-box .group-line{margin:4px 0;font-size:11px}
.resumen-box .group-line strong{color:var(--azul)}

@media(min-width:768px){
body{padding-bottom:80px}
main{max-width:900px;margin:0 auto;padding:16px}
.round-col{min-width:200px;max-width:240px}
.round-col.connector-col{min-width:32px;max-width:32px}
.bracket-match{height:56px;font-size:12px;padding:6px 10px}
.bracket-match .team{font-size:11px}
.bracket-match .score-input{width:28px;height:30px;font-size:13px}
.partido-card{font-size:14px;padding:10px 12px}
.partido-card .score-input{width:40px;height:38px;font-size:17px}
header h1{font-size:22px}
header img{height:44px;width:44px}
.grupo-card{margin-bottom:14px}
nav button{font-size:11px;padding:10px 4px}
nav button .icon{font-size:18px}
.tabla-pos{font-size:13px}
.tabla-pos th{font-size:11px;padding:6px 4px}
.tabla-pos td{font-size:12px;padding:5px 4px}
}
@media(max-width:380px){
.round-col{min-width:130px}
.bracket-match .score-input{width:18px;height:22px;font-size:10px}
.partido-card .score-input{width:30px;height:30px;font-size:13px}
}
</style>
</head>

function cargarEstado(){
  try{
    const r=localStorage.getItem(STO_KEY);
    if(r){
      const s=JSON.parse(r);
      if(!s.poolSel)s.poolSel=[];
      if(!s.cruces16||s.cruces16.length!==16)s.cruces16=Array.from({length:16},()=>({local:null,visit:null}));
      if(!s.faseElim)s.faseElim='pool';

  }catch(e){}

}

// ===================== HELPERS =====================
function idGolGpo(g,mi){return 'g_'+g+'_'+mi}
function idGolBra(phase,idx){return phase+'_'+idx}

function gol(id){
  const m=E.goles[id];
  return m?{l:m.l||0,v:m.v||0,t:!!m.t}:{l:0,v:0,t:false};
}
function setGol(id,l,v){
  if(!E.goles[id])E.goles[id]={l:0,v:0};
  E.goles[id].l=Math.max(0,parseInt(l)||0);
  E.goles[id].v=Math.max(0,parseInt(v)||0);
  E.goles[id].t=true;
  guardar();
}
function hayGanador(id){const s=gol(id);return s.l!==s.v}
function ganador(id){const s=gol(id);return s.l>s.v?1:2}
function ganador(id){const s=gol(id);if(s.l>s.v)return'L';if(s.v>s.l)return'V';return null}

function posiciones(grupo){
  const eqs=GRUPOS[grupo],st={};
  eqs.forEach(e=>{st[e]={p:0,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,dg:0}});
  PARTIDOS_GRUPO.filter(m=>m.grupo===grupo).forEach((m,i)=>{
    const s=gol(idGolGpo(grupo,i));
    if(!s.t)return;
    st[m.local].pj++;st[m.visit].pj++;
    st[m.local].gf+=s.l;st[m.local].gc+=s.v;
    st[m.visit].gf+=s.v;st[m.visit].gc+=s.l;
    if(s.l>s.v){st[m.local].pg++;st[m.local].p+=3;st[m.visit].pp++}
    else if(s.l<s.v){st[m.visit].pg++;st[m.visit].p+=3;st[m.local].pp++}
    else{st[m.local].pe++;st[m.local].p++;st[m.visit].pe++;st[m.visit].p++}
  });
  eqs.forEach(e=>{st[e].dg=st[e].gf-st[e].gc});
  return eqs.map(e=>({n:e,...st[e]})).sort((a,b)=>b.p-a.p||b.dg-a.dg||b.gf-a.gf);
}

function todosEquipos(){return GRP.flatMap(g=>GRUPOS[g].map(e=>({nombre:e,grupo:g})))}

// ===================== RESOLVER =====================
function teamByGroupPos(code){
  if(code==='??')return null;
  const pos=parseInt(code[0])-1;
  const grp=code[1];
  const p=posiciones(grp);
  return p[pos]?p[pos].n:'?';
}
function getTeam16(idx,lado){
  const code=R16[idx][lado==='local'?1:2];
  if(code!=='??')return teamByGroupPos(code);
  const c=(E.cruces16||[])[idx];
  return c?c[lado]:null;
}

function resolverBracket(matchLabel,lado){
  for(const b of BRACKET_PHASES){
    const idx=b.arr.findIndex(m=>m[0]===matchLabel);
    if(idx>=0)return resolver(b.arr[idx][lado==='L'?1:2]);
  }
  return'?';
}

function resolver(q){
  if(!q)return'?';
  if(q.startsWith('W.')){
    const src=q.substring(2);
    for(const b of BRACKET_PHASES){
      const idx=b.arr.findIndex(m=>m[0]===src);
      if(idx>=0){
        // For sf (16avos), get teams from cruces16
        if(b.phase==='sf'){
          const s=gol(idGolBra(b.phase,idx));
          if(s.l>s.v)return getTeam16(idx,'local')||'?';
          if(s.v>s.l)return getTeam16(idx,'visit')||'?';
          return'?';
        }
        const s=gol(idGolBra(b.phase,idx));
        if(s.l>s.v)return resolverBracket(src,'L');
        if(s.v>s.l)return resolverBracket(src,'V');
        return'?';
      }
    }
    return'?';
  }
  if(q.startsWith('L.')){
    const src=q.substring(2);
    for(const b of BRACKET_PHASES){
      const idx=b.arr.findIndex(m=>m[0]===src);
      if(idx>=0){
        if(b.phase==='sf'){
          const s=gol(idGolBra(b.phase,idx));
          if(s.l<s.v)return getTeam16(idx,'local')||'?';
          if(s.v<s.l)return getTeam16(idx,'visit')||'?';
          return'?';
        }
        const s=gol(idGolBra(b.phase,idx));
        if(s.l<s.v)return resolverBracket(src,'L');
        if(s.v<s.l)return resolverBracket(src,'V');
        return'?';
      }
    }
    return'?';
  }
  if(q.startsWith('P.')){
    const idx=parseInt(q.substring(2));
    // For 16avos pool matches, get from cruces16
    // This way is used when rendering the bracket
    const idx16=Math.floor(idx/2);
    const lado=idx%2===0?'local':'visit';
    const c=(E.cruces16||[])[idx16];
    return c?c[lado]||'?':'?';
  }
  return'?';
}

    h+=`<div class="pool-grupo"><div class="pool-grupo-tit">Grupo ${g}</div>`;
    const eqs=GRUPOS[g];
    eqs.forEach(e=>{
      const idx=pos.findIndex(p=>p.n===e);
      const badge=idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'-';
      if(idx<=1){
        // 1st/2nd: locked
        h+=`<label class="pool-eq disabled">
          <input type="checkbox" data-ename="${e}" checked disabled>
          <span>${flag(e)} ${e}</span>
          <span class="pos-badge">${badge} Clasificado</span>
        </label>`;
      }else if(idx===2){
        // 3rd: optional toggle
        const checked=E.poolSel.includes(e)?'checked':'';
        const disabled=!checked&&E.poolSel.length>=8?'disabled':'';
        h+=`<label class="pool-eq${disabled?' disabled':''}">
          <input type="checkbox" data-ename="${e}" ${checked} ${disabled}>
          <span>${flag(e)} ${e}</span>
          <span class="pos-badge">${badge} 3°</span>
        </label>`;

        // 4th: eliminated
        h+=`<div class="pool-eq elim">

          <span>${flag(e)} ${e}</span>
          <span class="pos-badge">❌ Eliminado</span>
        </div>`;
      }
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  h+=`<div class="pool-contador">24 clasificados + ${E.poolSel.length}/8 terceros seleccionados</div>`;
  const ok=poolCompleto();
  h+=`<button class="btn btn-celeste btn-block" data-act="ir-armado" ${ok?'':'disabled'}>Continuar →</button>`;
  return h;
}

function tarjetaBra(phase,idx,code,qL,qV,num,info){
  const mid=idGolBra(phase,idx),s=gol(mid);
  let local='?',visit='?';
  if(phase==='sf'){
    local=getTeam16(idx,'local')||'?';
    visit=getTeam16(idx,'visit')||'?';
  }else{
    local=resolver(qL);visit=resolver(qV);
  }
  const gan=hayGanador(mid);
  const edit=local!=='?'&&visit!=='?';
  let cls='bracket-match';
  if(gan)cls+=' match-win';
  let h=`<div class="${cls}">`;
  if(num)h+=`<div class="match-num">#${num}</div>`;
  if(edit){
    h+=`<div class="team local">${flag(local)} ${local}</div>`;
    h+=`<input class="score-input" type="number" min="0" max="99" data-mid="${mid}" data-side="l" value="${s.t?s.l:''}" inputmode="numeric">`;
    h+=`<div class="score-sep">-</div>`;
    h+=`<input class="score-input" type="number" min="0" max="99" data-mid="${mid}" data-side="v" value="${s.t?s.v:''}" inputmode="numeric">`;
    h+=`<div class="team visit">${flag(visit)} ${visit}</div>`;
  }else{
    h+=`<div class="team local">${local}</div>`;
    h+=`<span style="grid-column:span 3;text-align:center;color:#ccc;">—</span>`;
    h+=`<div class="team visit">${visit}</div>`;
  }
  if(info)h+=`<div class="match-info">${info}</div>`;
  h+=`</div>`;
  return h;
}

  function lineaElim(tit,phase,infoArr,from,to){
    h+=`<hr style="border-color:#eee;margin:12px 0"><strong style="color:var(--azul);font-size:14px;">${tit}</strong>`;
    for(let i=from;i<=to;i++){
      const idx=i-from,mid=idGolBra(phase,idx),s=gol(mid);
      let local='?',visit='?';
      if(phase==='sf'){local=getTeam16(idx,'local')||'?';visit=getTeam16(idx,'visit')||'?'}
      else if(phase==='of'){const m=R8[idx];local=resolver(m[1]);visit=resolver(m[2])}
      else if(phase==='cf'){const m=R4[idx];local=resolver(m[1]);visit=resolver(m[2])}
      else if(phase==='sm'){const m=R2[idx];local=resolver(m[1]);visit=resolver(m[2])}
      else if(phase==='fn'){const m=RF[idx];local=resolver(m[1]);visit=resolver(m[2])}

  lineaElim('Cuartos de Final','cf',INFO_R4,97,100);
  lineaElim('Semifinales','sm',INFO_R2,101,102);

  // Final teams (reused for champion)
  const mFinal=RF[0],midFinal=idGolBra('fn',0),sFinal=gol(midFinal);
  let finalLocal=resolver(mFinal[1]),finalVisit=resolver(mFinal[2]);

  // 3er Puesto + Final
  h+=`<hr style="border-color:#eee;margin:12px 0"><strong style="color:var(--azul);font-size:14px;">Final y 3er Puesto</strong>`;

    const mid=idGolBra('fn',phaseIdx),s=gol(mid);
    let local,visit;

    else{const m3=RF[1];local=resolver(m3[1]);visit=resolver(m3[2])}

    h+=`<hr style="border-color:#eee;margin:12px 0"><div style="text-align:center;font-size:18px;font-weight:700;color:var(--dorado);">🏆 Campeón: ${flag(ganF)} ${ganF}</div>`;

  h+=`</div>`;
  h+=`<div style="margin-top:16px;text-align:center;"><button class="btn btn-riesgo" data-act="reiniciar">🔄 Reiniciar todo</button></div>`;
  return h;
}

// ===================== EVENTS =====================
function bindEvents(){
  // Score inputs
  document.querySelectorAll('.score-input').forEach(el=>{
    el.addEventListener('change',function(){
      const mid=this.dataset.mid,side=this.dataset.side;
      let val=parseInt(this.value);
      if(isNaN(val))val=0;
      val=Math.max(0,Math.min(99,val));
      const s=gol(mid);
      if(side==='l')setGol(mid,val,s.v);
      else setGol(mid,s.l,val);
      requestAnimationFrame(()=>render());
    });
    el.addEventListener('focus',function(){this.select()});
  });
  
  // Group toggles
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click',function(){E.grupoAbierto=E.grupoAbierto===this.dataset.toggle?null:this.dataset.toggle;render()});
  });
  
  // Tab nav
  document.querySelectorAll('nav button').forEach(el=>{
    el.addEventListener('click',function(){
      document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      render();
    });
  });
  
  // Pool checkboxes
  document.querySelectorAll('input[type="checkbox"][data-ename]').forEach(el=>{
    el.addEventListener('change',function(){
      const name=this.dataset.ename;
      if(this.checked){
        if(!E.poolSel.includes(name)&&E.poolSel.length<32){
          E.poolSel.push(name);
        }
      }else{
        // Remove from sel and clear from any cruce
        E.poolSel=E.poolSel.filter(x=>x!==name);
        (E.cruces16||[]).forEach(c=>{
          if(c.local===name)c.local=null;
          if(c.visit===name)c.visit=null;
        });
      }
      guardar();
      render();
    });
  });
  
  // Go to armado
  document.querySelector('[data-act="ir-armado"]')?.addEventListener('click',function(){
    if(poolCompleto()){E.faseElim='armado';guardar();render()}
  });
  
  // Go to bracket
  document.querySelector('[data-act="iniciar-bracket"]')?.addEventListener('click',function(){
    if(crucesCompletos()){E.faseElim='bracket';guardar();render()}
  });
  
  // Back to pool
  document.querySelector('[data-act="volver-pool"]')?.addEventListener('click',function(){
    E.faseElim='armado';render();
  });
  
  // ====== SLOT CLICK (tap to assign) ======
  document.querySelectorAll('[data-cruce]').forEach(el=>{
    el.addEventListener('click',function(e){
      if(e.target.closest('.remove'))return; // handled separately
      if(dragInfo.team){
        const cruce=parseInt(this.dataset.cruce),lado=this.dataset.lado;
        // Check if team already in another slot
        for(let i=0;i<(E.cruces16||[]).length;i++){
          if(E.cruces16[i].local===dragInfo.team)E.cruces16[i].local=null;
          if(E.cruces16[i].visit===dragInfo.team)E.cruces16[i].visit=null;
        }
        E.cruces16[cruce][lado]=dragInfo.team;
        dragInfo={active:false,team:null,el:null,clone:null};
        guardar();
        render();
      }
    });
  });
  
  // ====== FICHA CLICK (select team) ======
  document.querySelectorAll('.fichas-grid .ficha').forEach(el=>{
    el.addEventListener('click',function(){
      if(dragInfo.team===this.dataset.ename){
        dragInfo={active:false,team:null,el:null,clone:null};
        document.querySelectorAll('.ficha').forEach(f=>f.style.outline='');
      }else{
        dragInfo={active:true,team:this.dataset.ename,el:this};
        document.querySelectorAll('.ficha').forEach(f=>f.style.outline='');
        this.style.outline='2px solid var(--dorado)';
      }
    });
  });
  
  // ====== REMOVE team from cruce ======
  document.querySelectorAll('[data-remove]').forEach(el=>{
    el.addEventListener('click',function(e){
      e.stopPropagation();
      const cruce=parseInt(this.dataset.remove),lado=this.dataset.lado;
      E.cruces16[cruce][lado]=null;
      guardar();
      render();
    });
  });
  
  // ====== DRAG & DROP (desktop) ======
  document.querySelectorAll('.ficha').forEach(el=>{
    el.addEventListener('dragstart',function(e){
      e.dataTransfer.setData('text/plain',this.dataset.ename);
      this.style.opacity='.5';
    });
    el.addEventListener('dragend',function(){this.style.opacity=''});
  });
  document.querySelectorAll('[data-cruce]').forEach(el=>{
    el.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('drag-over')});
    el.addEventListener('dragleave',function(){this.classList.remove('drag-over')});
    el.addEventListener('drop',function(e){
      e.preventDefault();
      this.classList.remove('drag-over');
      const team=e.dataTransfer.getData('text/plain');
      const cruce=parseInt(this.dataset.cruce),lado=this.dataset.lado;
      if(E.poolSel.includes(team)){
        for(let i=0;i<(E.cruces16||[]).length;i++){
          if(E.cruces16[i].local===team)E.cruces16[i].local=null;
          if(E.cruces16[i].visit===team)E.cruces16[i].visit=null;
        }
        E.cruces16[cruce][lado]=team;
        guardar();
        render();
      }
    });
  });
  
  // ====== TOUCH DRAG (mobile) ======
  document.querySelectorAll('.ficha').forEach(el=>{
    el.addEventListener('touchstart',function(e){
      const t=e.touches[0];
      dragInfo={active:true,team:this.dataset.ename,el:this,clone:null};
      // Create floating clone
      const clone=this.cloneNode(true);
      clone.className='ficha ficha-drag';
      clone.style.left=(t.clientX-40)+'px';
      clone.style.top=(t.clientY-20)+'px';
      document.body.appendChild(clone);
      dragInfo.clone=clone;
      this.style.opacity='.3';
    },{passive:true});
  });
  
  function onTouchMove(e){
    if(!dragInfo.clone||!dragInfo.active)return;
    e.preventDefault();
    const t=e.touches[0];
    dragInfo.clone.style.left=(t.clientX-40)+'px';
    dragInfo.clone.style.top=(t.clientY-20)+'px';
    // Highlight nearest slot
    document.querySelectorAll('[data-cruce]').forEach(sl=>{
      const r=sl.getBoundingClientRect();
      if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
        sl.classList.add('drag-over');
      }else{
        sl.classList.remove('drag-over');
      }
    });
  }
  
  if(!window._touchInit){
    window._touchInit=true;
    document.addEventListener('touchmove',onTouchMove,{passive:false});
    document.addEventListener('touchend',function(e){
    if(!dragInfo.active)return;
    // Find the slot under the finger
    const t=e.changedTouches[0];
    let dropped=false;
    document.querySelectorAll('[data-cruce]').forEach(sl=>{
      const r=sl.getBoundingClientRect();
      if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom&&dragInfo.team){
        const cruce=parseInt(sl.dataset.cruce),lado=sl.dataset.lado;
        if(E.poolSel.includes(dragInfo.team)){
          for(let i=0;i<(E.cruces16||[]).length;i++){
            if(E.cruces16[i].local===dragInfo.team)E.cruces16[i].local=null;
            if(E.cruces16[i].visit===dragInfo.team)E.cruces16[i].visit=null;
          }
          E.cruces16[cruce][lado]=dragInfo.team;
          guardar();
          dropped=true;
        }
      }
      sl.classList.remove('drag-over');
    });
    
    // Clean up
    if(dragInfo.clone){dragInfo.clone.remove();dragInfo.clone=null}
    if(dragInfo.el)dragInfo.el.style.opacity='';
    dragInfo={active:false,team:null,el:null,clone:null};
    
    if(dropped)render();
  },{passive:true});
  }
  
  // Reiniciar
  document.querySelector('[data-act="reiniciar"]')?.addEventListener('click',function(){
    if(confirm('¿Estás seguro? Se borrarán TODOS los resultados.')){
      E=estadoDefault();
      // Preselect 1st and 2nd
      E.poolSel=preseleccionar();
      guardar();
      document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
      document.querySelector('[data-tab="grupos"]')?.classList.add('active');
      render();
    }
  });
}

// ===================== REDES MODAL =====================
(function(){
  document.querySelector('.verlies-tech')?.addEventListener('click',function(e){
    if(e.target.closest('.verlies-tech')){
      const m=document.getElementById('redes-modal');
      if(m)m.classList.remove('hidden');
    }
  });
  document.getElementById('redes-modal')?.addEventListener('click',function(e){
    if(e.target===this)this.classList.add('hidden');
  });
  document.querySelector('.modal-close')?.addEventListener('click',function(){
    const m=document.getElementById('redes-modal');
    if(m)m.classList.add('hidden');
  });
})();

// ===================== INIT =====================
// Ensure presets on first load
if(E.poolSel.length===0){
  E.poolSel=preseleccionar();
  guardar();
}
render();
</script>
</body>
</html>
